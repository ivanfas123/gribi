<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Грибная лавка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Onest:wght@400;500;600&display=swap">
<style>
:root{--bg:#ece7da;--card:#f7f3e8;--ink:#27301f;--muted:#6c7360;--moss:#3f5a2b;--line:#d6cfbb;--cap:#9a4a2a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1d2318;--card:#273021;--ink:#eae6d6;--muted:#a1a890;--moss:#9cc277;--line:#39432f;--cap:#d98a5f;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Onest,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(env(safe-area-inset-bottom,0) + 24px)}
header{padding:28px 20px 8px}
h1{font:800 34px/1.05 Fraunces,Georgia,serif;letter-spacing:-.5px}
header p{color:var(--muted);margin-top:8px;max-width:30ch}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 20px 0;padding:10px 14px;border-radius:14px;background:var(--moss);color:var(--bg);font-weight:600}
.bar button{background:none;border:1.5px solid currentColor;color:inherit;border-radius:999px;padding:6px 12px;font:500 14px Onest,sans-serif;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:500 15px Onest,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--moss);border-color:var(--moss);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--cap);outline-offset:2px}
main,#tools{padding:0 20px}
#tools{margin-bottom:12px}
.row{display:flex;align-items:center;background:var(--card);border-bottom:1px solid var(--line)}
.row:first-child{border-radius:16px 16px 0 0}.row:last-child{border-radius:0 0 16px 16px;border-bottom:0}.row:only-child{border-radius:16px}
.item{flex:1;min-width:0;display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;text-align:left;background:none;border:0;padding:14px 12px;color:inherit;font:inherit;cursor:pointer;border-radius:inherit}
.row.out .item{opacity:.5}
.item h3{font:600 18px/1.2 Fraunces,Georgia,serif}
.item small{color:var(--muted);display:block;margin-top:3px}
.price{font-weight:600;text-align:right;white-space:nowrap}
.price small{font-weight:400}
.sw{flex:none;margin-right:12px;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--bg);transition:transform .15s}
.sw[aria-checked=true]{background:var(--moss)}.sw[aria-checked=true]::after{transform:translateX(22px)}
.empty{padding:40px 0;color:var(--muted);text-align:center}
dialog{border:0;border-radius:22px 22px 0 0;background:var(--bg);color:var(--ink);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;margin:auto auto 0;padding:24px 20px calc(env(safe-area-inset-bottom,0) + 24px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog svg{width:110px;height:110px;display:block;margin:0 auto 12px}
dialog h2{font:800 28px/1.1 Fraunces,Georgia,serif;text-align:center}
dialog .lat{color:var(--muted);text-align:center;font-style:italic;margin-top:4px}
dialog p{margin:16px 0}
.meta{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 0;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600;text-align:right}
.btn{display:block;width:100%;text-align:center;background:var(--moss);color:var(--bg);border:0;border-radius:14px;padding:15px;font:600 16px Onest,sans-serif;cursor:pointer;text-decoration:none;margin-top:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:8px}
.qty-label{margin-top:14px;font-weight:500}
.stepper{display:flex;align-items:center;gap:10px;margin-top:8px}
.stepper button{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 24px Onest,sans-serif;cursor:pointer}
.stepper input{flex:1;min-width:0;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 20px Onest,sans-serif;text-align:center}
.stepper span{color:var(--muted);width:24px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.total{margin-top:14px;font-size:18px}
label{display:block;margin-top:12px;font-weight:500}
.fld{display:block;width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:400 16px Onest,sans-serif;padding:11px 12px}
input[type=color].fld{height:46px;padding:4px}
label.chk{display:flex;align-items:center;gap:10px}
label.chk input{width:22px;height:22px;accent-color:var(--moss)}
</style>
</head>
<body>
<header>
  <h1>Грибная лавка</h1>
  <p>Сушёные, свежие грибы и экстракты</p>
</header>
<div class="bar" id="bar" hidden></div>
<div class="chips" id="chips" role="group" aria-label="Категории"></div>
<div id="tools"></div>
<main id="list"></main>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
const SHOP_CONTACT = "your_username"; // ник менеджера для заказов, без @
const API = "https://ВАШ-ВОРКЕР.workers.dev"; // адрес Cloudflare Worker, без / в конце
const CATS = ["Сушёные", "Экстракты", "Свежие", "Другое"];
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let PRODUCTS = [], current = CATS[0], isAdmin = false, preview = false;
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("ru-RU") + " ₽";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const notify = m => tg ? tg.showAlert(m) : alert(m);
const ask = (m, cb) => tg ? tg.showConfirm(m, cb) : cb(confirm(m));
const adminMode = () => isAdmin && !preview;

const api = (path, body) => fetch(API + path, {
  method: body ? "POST" : "GET",
  headers: {"Content-Type": "application/json", "X-Init-Data": tg ? tg.initData : ""},
  body: body ? JSON.stringify(body) : undefined
}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

function icon(color){
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <rect x="40" y="48" width="20" height="38" rx="9" fill="#e9dfc6"/>
    <path d="M8 54C8 28 28 12 50 12s42 16 42 42z" fill="${esc(color)}"/>
    <circle cx="34" cy="34" r="5" fill="#fff" fill-opacity=".35"/>
    <circle cx="62" cy="28" r="4" fill="#fff" fill-opacity=".3"/>
    <circle cx="72" cy="44" r="3" fill="#fff" fill-opacity=".3"/></svg>`;
}

function render(){
  // панель режима
  $("bar").hidden = !isAdmin;
  if (isAdmin){
    $("bar").innerHTML = `<span>${preview ? "Так видят покупатели" : "Режим продавца"}</span><button id="mode">${preview ? "К управлению" : "Как у покупателя"}</button>`;
    $("mode").onclick = () => { preview = !preview; render(); };
  }
  // категории
  $("chips").innerHTML = CATS.map(c => `<button class="chip" aria-pressed="${c===current}" data-c="${c}">${c}</button>`).join("");
  // кнопка добавления
  $("tools").innerHTML = adminMode() ? `<button class="btn" id="addBtn" style="margin-top:0">+ Добавить товар</button>` : "";
  if (adminMode()) $("addBtn").onclick = () => openForm();
  // список
  const adm = adminMode();
  const items = PRODUCTS.filter(p => p.cat === current);
  $("list").innerHTML = items.length ? items.map(p => `
    <div class="row ${p.stock ? "" : "out"}">
      <button class="item" data-id="${p.id}">
        <span style="width:72px;height:72px;display:block">${icon(p.cap)}</span>
        <span><h3>${esc(p.name)}</h3><small>${p.stock ? esc(p.lat) : "Нет в наличии"}</small></span>
        <span class="price">${fmt(p.price)}<small>${p.by==="g" ? " / 100 г" : " / " + esc(p.unit || "шт")}</small></span>
      </button>
      ${adm ? `<button class="sw" role="switch" aria-checked="${p.stock}" aria-label="В наличии: ${esc(p.name)}" data-sw="${p.id}"></button>` : ""}
    </div>`).join("")
    : `<p class="empty">${adm ? "Здесь пока пусто. Нажмите «Добавить товар»." : "В этой категории пока пусто"}</p>`;
}

async function persist(p){
  try {
    const r = await api("/api/save", p);
    const i = PRODUCTS.findIndex(x => x.id === r.id);
    if (i >= 0) PRODUCTS[i] = r; else PRODUCTS.push(r);
    render();
    return r;
  } catch (e) {
    notify("Не удалось сохранить. Откройте приложение заново из бота и повторите.");
    return null;
  }
}

// ---------- экран покупателя ----------
function openItem(p){
  const g = p.by === "g";
  const cfg = g ? {min:50, step:50, def:200, presets:[100,250,500,1000], unit:"г"}
                : {min:1, step:1, def:1, presets:[1,2,3,5], unit:"шт"};
  $("dlgBody").innerHTML = `
    ${icon(p.cap)}
    <h2>${esc(p.name)}</h2>${p.lat ? `<div class="lat">${esc(p.lat)}</div>` : ""}
    ${p.desc ? `<p>${esc(p.desc)}</p>` : ""}
    <div class="meta"><span>Цена</span><b>${g ? fmt(p.price) + " за 100 г" : fmt(p.price) + " за " + esc(p.unit || "шт")}</b></div>
    ${p.stock ? `
    <div class="qty-label" id="qtyLabel">${g ? "Сколько граммов" : "Количество"}</div>
    <div class="stepper">
      <button id="minus" aria-label="Меньше">−</button>
      <input id="qty" type="number" inputmode="numeric" min="${cfg.min}" step="${cfg.step}" value="${cfg.def}" aria-labelledby="qtyLabel">
      <span>${cfg.unit}</span>
      <button id="plus" aria-label="Больше">+</button>
    </div>
    <div class="presets">${cfg.presets.map(v => `<button class="chip" data-v="${v}">${v} ${cfg.unit}</button>`).join("")}</div>
    <div class="meta total"><span>Итого</span><b id="total"></b></div>
    <a class="btn" id="order" href="#">Заказать</a>` :
    `<div class="meta"><span>Наличие</span><b>Нет в наличии</b></div>`}
    <button class="btn ghost" id="close">Закрыть</button>`;
  $("close").onclick = () => $("dlg").close();
  if (p.stock){
    const upd = () => {
      const qty = Math.max(cfg.min, Math.round((+$("qty").value || cfg.min) / cfg.step) * cfg.step);
      const sum = g ? Math.round(p.price * qty / 100) : p.price * qty;
      $("total").textContent = `${g ? qty + " г" : qty + " × " + (p.unit || "шт")} — ${fmt(sum)}`;
      const text = `Здравствуйте! Хочу заказать: ${p.name}, ${g ? qty + " г" : qty + " шт (" + (p.unit || "шт") + ")"} — ${fmt(sum)}`;
      $("order").href = `https://t.me/${SHOP_CONTACT}?text=${encodeURIComponent(text)}`;
    };
    const set = v => { $("qty").value = Math.max(cfg.min, v); upd(); };
    $("minus").onclick = () => set((+$("qty").value || cfg.min) - cfg.step);
    $("plus").onclick = () => set((+$("qty").value || cfg.min) + cfg.step);
    $("qty").onchange = upd;
    $("dlgBody").querySelectorAll(".presets .chip").forEach(b => b.onclick = () => set(+b.dataset.v));
    $("order").onclick = e => { if (tg){ e.preventDefault(); tg.openTelegramLink($("order").href); } };
    upd();
  }
  $("dlg").showModal();
}

// ---------- экран продавца ----------
function openForm(p){
  const isNew = !p;
  p = p || {name:"", lat:"", cat:current, by:"g", price:"", unit:"", stock:true, cap:"#9a5a32", desc:""};
  $("dlgBody").innerHTML = `
    <h2>${isNew ? "Новый товар" : "Редактирование"}</h2>
    <form id="f">
      <label>Название<input class="fld" name="name" required maxlength="60" value="${esc(p.name)}"></label>
      <label>Латинское название (необязательно)<input class="fld" name="lat" maxlength="60" value="${esc(p.lat)}"></label>
      <label>Категория<select class="fld" name="cat">${CATS.map(c => `<option ${c===p.cat ? "selected" : ""}>${c}</option>`).join("")}</select></label>
      <label>Как продаётся<select class="fld" name="by">
        <option value="g" ${p.by==="g" ? "selected" : ""}>На вес, цена за 100 г</option>
        <option value="pcs" ${p.by==="pcs" ? "selected" : ""}>Штуками, цена за 1 шт</option></select></label>
      <label>Цена, ₽<input class="fld" name="price" type="number" inputmode="numeric" min="0" required value="${esc(p.price)}"></label>
      <label id="unitL">Что за штука (например, флакон 50 мл)<input class="fld" name="unit" maxlength="40" value="${esc(p.unit)}"></label>
      <label>Описание<textarea class="fld" name="desc" rows="3" maxlength="500">${esc(p.desc)}</textarea></label>
      <label>Цвет значка<input class="fld" name="cap" type="color" value="${esc(p.cap)}"></label>
      <label class="chk"><input name="stock" type="checkbox" ${p.stock ? "checked" : ""}> В наличии</label>
      <button class="btn" type="submit">Сохранить</button>
    </form>
    ${isNew ? "" : `<button class="btn ghost" id="del">Удалить товар</button>`}
    <button class="btn ghost" id="close">Закрыть</button>`;
  const f = $("f");
  const syncUnit = () => $("unitL").hidden = f.by.value !== "pcs";
  f.by.onchange = syncUnit; syncUnit();
  f.onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    d.stock = f.stock.checked; d.price = +d.price;
    if (!isNew) d.id = p.id;
    const r = await persist(d);
    if (r){ current = r.cat; render(); $("dlg").close(); }
  };
  $("close").onclick = () => $("dlg").close();
  if (!isNew) $("del").onclick = () => ask(`Удалить «${p.name}»?`, async ok => {
    if (!ok) return;
    try { await api("/api/delete", {id: p.id}); PRODUCTS = PRODUCTS.filter(x => x.id !== p.id); render(); $("dlg").close(); }
    catch (e) { notify("Не удалось удалить. Откройте приложение заново из бота."); }
  });
  $("dlg").showModal();
}

// ---------- события ----------
$("chips").onclick = e => { const b = e.target.closest(".chip"); if (b){ current = b.dataset.c; render(); } };
$("list").onclick = e => {
  const sw = e.target.closest(".sw");
  if (sw){ const p = PRODUCTS.find(x => x.id === sw.dataset.sw); persist({...p, stock: !p.stock}); return; }
  const it = e.target.closest(".item");
  if (!it) return;
  const p = PRODUCTS.find(x => x.id === it.dataset.id);
  adminMode() ? openForm(p) : openItem(p);
};
$("dlg").onclick = e => { if (e.target === $("dlg")) $("dlg").close(); };

(async () => {
  try {
    const [p, me] = await Promise.all([api("/api/products"), api("/api/me")]);
    PRODUCTS = p; isAdmin = !!me.admin;
    render();
  } catch (e) {
    $("list").innerHTML = `<p class="empty">Не удалось загрузить каталог. Попробуйте позже.</p>`;
  }
})();
</script>
</body>
</html>
